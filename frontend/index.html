<!doctype html>
<html lang="en" class="dark">

<head>
  <meta charset="UTF-8" />
  <link rel="icon" type="image/svg+xml"
    href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🌱</text></svg>" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>AgriSense AI – Next-Generation Intelligent Agriculture Decision Support Platform</title>
  <meta name="description"
    content="Commercial-grade AI-powered agricultural intelligence platform for crop disease detection, multilingual voice advisory, weather forecasting, APMC market analytics, and farm digital twin." />

  <!-- Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link
    href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&family=JetBrains+Mono:wght@400;500&display=swap"
    rel="stylesheet">

  <!-- Leaflet CSS -->
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
    integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY=" crossorigin="" />
</head>

<body
  class="bg-slate-50 dark:bg-slate-950 text-slate-900 dark:text-slate-100 font-sans antialiased selection:bg-emerald-500 selection:text-white min-h-screen">
  <div id="root"></div>
  <script type="module" src="/src/main.tsx"></script>

  <!-- CSS to completely conceal standard Google Translate UI -->
  <style>
    #google_translate_element {
      display: none !important;
    }

    .goog-te-banner-frame {
      display: none !important;
    }

    .skiptranslate {
      display: none !important;
    }

    body {
      top: 0px !important;
    }
  </style>

  <!-- Google Translate Script (Runs infinitely in background) -->
  <script type="text/javascript">
    function googleTranslateElementInit() {
      new google.translate.TranslateElement({
        pageLanguage: 'en',
        includedLanguages: 'en,hi,bn,te,mr,ta,ur,gu,kn,ml,pa,or,as',
        layout: google.translate.TranslateElement.InlineLayout.SIMPLE,
        autoDisplay: false
      }, 'google_translate_element');
    }
  </script>
  <script type="text/javascript"
    src="//translate.google.com/translate_a/element.js?cb=googleTranslateElementInit"></script>
</body>

</html>
